<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Calculators All in One - Free Online Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --primary: #2563eb; --primary-dark: #1e40af; 
      --text: #111827; --text-muted: #6b7280; 
      --bg: #ffffff; --bg-alt: #f8fafc;
      --border: #e2e8f0; --radius: 8px; 
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: #1e40af; text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 1rem; }
    
    /* Header */
    .site-header { background: #fff; border-bottom: 2px solid #1e40af; padding: 1rem 0; text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .logo-icon { background: var(--primary); color: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.5rem; }
    
    /* Layout */
    .main-layout { display: flex; flex-direction: column; gap: 2rem; padding: 2rem 0; }
    @media (min-width: 768px) {
      .main-layout { flex-direction: row; align-items: flex-start; }
      .calculator-section { width: 400px; flex-shrink: 0; }
      .tools-section { flex-grow: 1; }
    }

    /* Quick Calculator */
    .calculator-box { 
      background: #e2e8f0; 
      border: 1px solid #94a3b8;
      border-radius: var(--radius); 
      padding: 10px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    .qc-tabs { display: flex; margin-bottom: 10px; }
    .qc-tab { background: #f1f5f9; border: 1px solid #94a3b8; padding: 5px 15px; font-weight: bold; cursor: pointer; }
    .qc-tab.active { background: #fff; border-bottom-color: #fff; }
    .qc-display { background: #3b6999; color: #fff; padding: 0.5rem; text-align: right; font-size: 2rem; font-weight: 600; min-height: 60px; margin-bottom: 10px; display: flex; align-items: center; justify-content: flex-end; overflow-x: auto; }
    .qc-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .qc-btn { background: #cbd5e1; border: 1px solid #94a3b8; padding: 0.8rem 0; font-size: 1.1rem; font-weight: 600; color: var(--text); cursor: pointer; border-radius: 2px; }
    .qc-btn:hover { background: #94a3b8; }
    .qc-btn.op { background: #fff; }
    .qc-btn.op:hover { background: #f1f5f9; }
    .qc-btn.equal { background: #cbd5e1; font-weight: bold; }

    /* Tools List */
    .category-header { background: #1e40af; color: #fff; padding: 0.5rem 1rem; font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; margin-top: 1.5rem; }
    .category-header:first-child { margin-top: 0; }
    .tool-list { display: grid; grid-template-columns: 1fr; gap: 0.5rem; padding-left: 1rem; }
    @media (min-width: 600px) { .tool-list { grid-template-columns: 1fr 1fr; } }
    .tool-list a { display: block; font-size: 1.05rem; padding: 0.2rem 0; }
    
    /* Display Area */
    .tool-display-area { display: none; padding: 2rem 0; max-width: 600px; margin: 0 auto; }
    .tool-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; color: #374151; }
    .input-group input, .input-group select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; outline: none; }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .btn { background: #2563eb; color: white; padding: 0.85rem; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background: #1e40af; }
    .result-box { display: none; margin-top: 1.5rem; padding: 1.5rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; text-align: center; }
    
    /* Search */
    .search-box { margin-bottom: 1.5rem; position: relative; }
    .search-box input { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
    .search-results { list-style: none; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; display: none; position: absolute; z-index: 10; width: 100%; }
    .search-results li a { display: block; padding: 0.75rem 1rem; color: var(--text); border-bottom: 1px solid var(--border); }
    .search-results li a:hover { background: #f1f5f9; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="#" class="logo" onclick="showHome(); return false;">
      <span class="logo-icon">∑</span>
      <span>World Calculators</span>
    </a>
  </header>

  <!-- मुख्य होम पेज -->
  <div id="page-home" class="container main-layout">
    
    <!-- बाईं तरफ: कैलकुलेटर -->
    <div class="calculator-section">
      <div class="calculator-box">
        <div class="qc-tabs">
          <div class="qc-tab active">Basic</div>
          <div class="qc-tab">Scientific</div>
        </div>
        <div class="qc-display" id="qc-display">0</div>
        <div class="qc-buttons">
          <button class="qc-btn" onclick="qcInput('7')">7</button>
          <button class="qc-btn" onclick="qcInput('8')">8</button>
          <button class="qc-btn" onclick="qcInput('9')">9</button>
          <button class="qc-btn op" onclick="qcInput('+')">+</button>
          <button class="qc-btn op" onclick="qcBack()">Back</button>

          <button class="qc-btn" onclick="qcInput('4')">4</button>
          <button class="qc-btn" onclick="qcInput('5')">5</button>
          <button class="qc-btn" onclick="qcInput('6')">6</button>
          <button class="qc-btn op" onclick="qcInput('-')">−</button>
          <button class="qc-btn op" onclick="qcInput('ans')">Ans</button>

          <button class="qc-btn" onclick="qcInput('1')">1</button>
          <button class="qc-btn" onclick="qcInput('2')">2</button>
          <button class="qc-btn" onclick="qcInput('3')">3</button>
          <button class="qc-btn op" onclick="qcInput('*')">×</button>
          <button class="qc-btn op" onclick="qcInput('m+')">M+</button>

          <button class="qc-btn" onclick="qcInput('0')">0</button>
          <button class="qc-btn" onclick="qcInput('.')">.</button>
          <button class="qc-btn op" onclick="qcInput('exp')">EXP</button>
          <button class="qc-btn op" onclick="qcInput('/')">/</button>
          <button class="qc-btn op" onclick="qcInput('m-')">M-</button>

          <button class="qc-btn op" onclick="qcInput('+/-')">±</button>
          <button class="qc-btn op" onclick="qcInput('rnd')">RND</button>
          <button class="qc-btn equal" onclick="qcClear()">AC</button>
          <button class="qc-btn equal" onclick="qcCalculate()">=</button>
          <button class="qc-btn op" onclick="qcInput('mr')">MR</button>
        </div>
      </div>
    </div>

    <!-- दाईं तरफ: टूल्स की सूची -->
    <div class="tools-section">
      <div class="search-box">
        <input type="text" id="toolSearch" placeholder="Search calculators..." onkeyup="searchTools()" onblur="setTimeout(hideSearch, 200)" onfocus="searchTools()" />
        <ul class="search-results" id="searchResults"></ul>
      </div>

      <div id="category-list"></div>
    </div>

  </div>

  <!-- टूल डिस्प्ले एरिया -->
  <div id="tool-display-area" class="container tool-display-area">
    <a onclick="showHome()" style="display: inline-block; margin-bottom: 1rem;">← Back to Home</a>
    <div class="tool-box">
      <h1 id="display-title" style="margin-bottom: 1.5rem; text-align: center; color: #1e40af;"></h1>
      <div id="display-content"></div>
    </div>
  </div>

  <!-- सभी 5 फाइलों को जोड़ें -->
  <script src="calc1.js"></script>
  <script src="calc2.js"></script>
  <script src="calc3.js"></script>
  <script src="calc4.js"></script>
  <script src="calc5.js"></script>
  
  <script>
    var allTools = [];
    var allHtmls = {};
    if(typeof tools1 !== 'undefined') { allTools = allTools.concat(tools1); Object.assign(allHtmls, htmls1); }
    if(typeof tools2 !== 'undefined') { allTools = allTools.concat(tools2); Object.assign(allHtmls, htmls2); }
    if(typeof tools3 !== 'undefined') { allTools = allTools.concat(tools3); Object.assign(allHtmls, htmls3); }
    if(typeof tools4 !== 'undefined') { allTools = allTools.concat(tools4); Object.assign(allHtmls, htmls4); }
    if(typeof tools5 !== 'undefined') { allTools = allTools.concat(tools5); Object.assign(allHtmls, htmls5); }

    // कैटेगरी (Categories) के हिसाब से टूल्स को बांटना
    var categories = {
      "Financial": ["emi", "interest", "gst", "discount", "tip", "compound", "sip", "tax", "salary", "retire"],
      "Health & Fitness": ["bmi", "age", "bodyfat", "bmr", "caldef", "water", "weightloss", "pregnancy", "bmikids"],
      "Math": ["percentage", "average", "gpa", "time", "random", "scientific", "fraction", "area", "volume", "quadratic", "pythagoras", "circumference", "stdev", "probability", "permcomb"],
      "Everyday Life": ["date-diff", "fuel", "electricity", "mileage", "currency"],
      "Physics & Engineering": ["ohm", "speeddist", "force", "work", "density", "molar", "concrete", "paint", "tile"],
      "Basic Tools": ["simplecalc"]
    };

    document.addEventListener('DOMContentLoaded', function() {
      var catList = document.getElementById('category-list');
      
      for (var catName in categories) {
        var header = document.createElement('div');
        header.className = 'category-header';
        header.textContent = catName;
        catList.appendChild(header);

        var listDiv = document.createElement('div');
        listDiv.className = 'tool-list';
        
        var toolIds = categories[catName];
        for (var i = 0; i < toolIds.length; i++) {
          var id = toolIds[i];
          var t = allTools.find(function(x) { return x.id === id; });
          if (t) {
            var a = document.createElement('a');
            a.href = "javascript:void(0)";
            a.textContent = t.name;
            a.onclick = (function(toolId) {
              return function() { showTool(toolId); };
            })(t.id);
            listDiv.appendChild(a);
          }
        }
        catList.appendChild(listDiv);
      }
    });

    function showTool(toolId) {
      document.getElementById('page-home').classList.add('hidden');
      document.getElementById('tool-display-area').style.display = 'block';
      var t = allTools.find(function(x) { return x.id === toolId; });
      document.getElementById('display-title').textContent = t.name;
      document.getElementById('display-content').innerHTML = allHtmls[toolId];
      window.scrollTo(0, 0);
    }

    function showHome() {
      document.getElementById('page-home').classList.remove('hidden');
      document.getElementById('tool-display-area').style.display = 'none';
      window.scrollTo(0, 0);
    }

    function searchTools() {
      var input = document.getElementById('toolSearch').value.toLowerCase();
      var results = document.getElementById('searchResults');
      results.innerHTML = '';
      if (input === '') { results.style.display = 'none'; return; }
      var matches = allTools.filter(function(t) { return t.name.toLowerCase().indexOf(input) !== -1; });
      if (matches.length === 0) { results.innerHTML = '<li><a>No tools found</a></li>'; } 
      else {
        for (var i = 0; i < matches.length; i++) {
          var t = matches[i];
          var li = document.createElement('li');
          li.innerHTML = '<a onclick="showTool(\'' + t.id + '\')">' + t.name + '</a>';
          results.appendChild(li);
        }
      }
      results.style.display = 'block';
    }
    function hideSearch() { document.getElementById('searchResults').style.display = 'none'; }

    // Quick Calculator Logic
    var qcStr = "0";
    var qcAns = 0;
    var qcMem = 0;
    
    function qcInput(val) {
      if (qcStr === "0" && val !== "." && val !== "+" && val !== "-" && val !== "*" && val !== "/") qcStr = "";
      if (val === 'ans') { qcStr += qcAns; }
      else if (val === 'm+') { qcMem = qcAns; return; }
      else if (val === 'm-') { qcMem = -qcAns; return; }
      else if (val === 'mr') { qcStr += qcMem; }
      else if (val === 'rnd') { qcStr += Math.random().toFixed(4); }
      else if (val === 'exp') { qcStr += 'e'; }
      else if (val === '+/-') { qcStr = (-parseFloat(qcStr)).toString(); }
      else { qcStr += val; }
      
      // डिस्प्ले पर * को × और / को ÷ दिखाने के लिए
      document.getElementById('qc-display').textContent = qcStr.replace(/\*/g, '×').replace(/\//g, '÷');
    }
    
    function qcClear() {
      qcStr = "0";
      document.getElementById('qc-display').textContent = "0";
    }
    
    function qcBack() {
      qcStr = qcStr.slice(0, -1);
      if (qcStr === "") qcStr = "0";
      document.getElementById('qc-display').textContent = qcStr.replace(/\*/g, '×').replace(/\//g, '÷');
    }
    
    function qcCalculate() {
      try {
        // स्क्रीन पर × और ÷ दिख रहा होगा, लेकिन हिसाब के लिए हमें * और / चाहिए
        var evalStr = qcStr.replace(/×/g, '*').replace(/÷/g, '/');
        var result = eval(evalStr);
        if (result === Infinity || isNaN(result)) throw Error();
        qcAns = result;
        qcStr = result.toString();
        document.getElementById('qc-display').textContent = qcStr;
      } catch (e) {
        document.getElementById('qc-display').textContent = "Error";
        qcStr = "0";
      }
    }
  </script>
</body>
</html>
